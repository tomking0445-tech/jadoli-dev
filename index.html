<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="마인크래프트 서버, 디스코드 봇, 홈페이지, 업무 자동화를 만드는 개발자 자돌이의 작업물 모음">
<meta property="og:title" content="자돌이 작업물 | Jadoli Portfolio">
<meta property="og:description" content="Minecraft servers, Discord bots, websites and automation">
<meta property="og:image" content="img/belmore.png">
<title>자돌이 작업물</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{--ink:#1d2420;--soft:#5b655e;--faint:#8a938c;--line:#e3e7df;--grass:#3f8a2e;--grass-dark:#2f6b22;--leaf:#eef5e9;--dirt:#7a5536}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:#fff;color:var(--ink);font-family:Pretendard,"Noto Sans KR",sans-serif;font-size:17px;line-height:1.75;word-break:keep-all}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--grass);outline-offset:3px}
.wrap{width:min(960px,calc(100% - 48px));margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:28px 0}
.name{font-family:Galmuri11,monospace;font-size:20px;text-decoration:none;color:var(--ink)}
.top nav a{margin-left:22px;font-size:15px;color:var(--soft);text-decoration:none}
.top nav a:hover{color:var(--ink)}
.intro{padding:56px 0 72px;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.intro h1{font-family:Galmuri11,monospace;font-weight:700;font-size:clamp(44px,7vw,76px);line-height:1.05;margin:0 0 28px;color:var(--grass-dark);letter-spacing:-1px}
.intro p{margin:0 0 14px;color:var(--soft);max-width:30em}
.intro p strong{color:var(--ink);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-block;padding:12px 20px;border-radius:6px;font-size:15px;font-weight:600;text-decoration:none;border:2px solid var(--ink)}
.btn.go{background:var(--grass);border-color:var(--grass);color:#fff;box-shadow:0 4px 0 var(--grass-dark)}
.btn.go:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--grass-dark)}
.btn.plain:hover{background:var(--leaf)}
.shot{position:relative}
.shot img{border-radius:4px;box-shadow:8px 8px 0 var(--leaf)}
.shot figcaption{font-size:13px;color:var(--faint);margin-top:14px}
h2{font-size:26px;letter-spacing:-.6px;margin:0 0 8px;line-height:1.35}
.lead{color:var(--soft);margin:0 0 32px}
section{padding:64px 0;border-top:1px solid var(--line)}
.feature{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;background:var(--leaf);padding:36px;border-radius:8px}
.feature h3{font-size:28px;margin:0 0 6px;letter-spacing:-.6px}
.feature .what{color:var(--grass-dark);font-weight:600;margin:0 0 16px;font-size:15px}
.feature ul{margin:0;padding-left:20px;color:var(--soft);font-size:15px}
.feature li{margin-bottom:6px}
.feature .pics{display:grid;gap:12px}
.feature .pics img{border-radius:4px;cursor:zoom-in}
.feature .more{margin-top:20px;background:none;border:0;padding:0;font-weight:600;color:var(--grass-dark);text-decoration:underline;text-underline-offset:4px}
.group{margin-top:48px}
.group h3{font-size:15px;color:var(--faint);font-weight:600;margin:0 0 6px}
.row{width:100%;display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 0}
.row img{border-radius:4px;aspect-ratio:1.72;object-fit:cover;width:100%}
.row strong{display:block;font-size:19px;letter-spacing:-.3px;margin-bottom:2px}
.row span{display:block;color:var(--soft);font-size:15px}
.row small{display:block;color:var(--faint);font-size:13px;margin-top:6px}
.row:hover strong{color:var(--grass-dark);text-decoration:underline;text-underline-offset:4px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:14px 12px 14px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--faint);font-weight:600}
td:first-child{font-weight:600;white-space:nowrap}
td:last-child{white-space:nowrap;color:var(--grass-dark);font-weight:600}
td:nth-child(2){color:var(--soft)}
.note{color:var(--soft);font-size:15px;margin:24px 0 0;max-width:40em}
.contact{background:var(--ink);color:#fff;padding:64px 0;border:0}
.contact h2{color:#fff}
.contact p{color:#c7cfc9;margin:0 0 28px;max-width:34em}
.contact .btn.plain{border-color:#fff;color:#fff}
.contact .btn.plain:hover{background:#ffffff1a}
footer{padding:28px 0;font-size:13px;color:var(--faint)}
dialog{border:0;border-radius:8px;padding:0;width:min(680px,calc(100% - 24px));max-height:90vh;overflow:auto;color:var(--ink)}
dialog::backdrop{background:#1d242099}
.dlg{padding:28px}
.dlg-top{display:flex;justify-content:space-between;align-items:start;gap:16px}
.dlg h2{margin:0}
.close{background:var(--leaf);border:0;border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600}
.dlg .status{color:var(--grass-dark);font-weight:600;font-size:14px;margin:4px 0 0}
.dlg p{color:var(--soft);white-space:pre-line;font-size:16px}
.dlg ul{padding-left:20px;color:var(--soft);font-size:15px}
.dlg img{border-radius:4px;margin:16px 0 0}
.dlg .tech{font-size:14px;color:var(--faint)}
@media(max-width:820px){.intro,.feature{grid-template-columns:1fr}.intro{gap:36px;padding-top:24px}.feature{padding:24px}.row{grid-template-columns:120px 1fr;gap:16px}.row strong{font-size:17px}td:nth-child(2){display:none}th:nth-child(2){display:none}}
@media(max-width:480px){body{font-size:16px}.top nav a{margin-left:14px;font-size:14px}.row{grid-template-columns:1fr}.row img{max-width:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:Pretendard,"Noto Sans KR","Noto Sans JP","Hiragino Sans","Microsoft YaHei","Noto Sans SC",sans-serif}
html[lang=ja] body,html[lang=zh] body{word-break:normal;line-break:strict}
.top{flex-wrap:wrap;gap:12px}
[hidden]{display:none!important}
.right{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top nav a{margin-left:0;margin-right:18px}
.langs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langs button{background:none;border:0;padding:5px 10px;font-size:13px;color:var(--soft)}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed=true]{background:var(--leaf);color:var(--grass-dark);font-weight:700}
@media(max-width:480px){.top nav a{margin-right:12px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="name" href="#" data-t="name">자돌이</a><div class="right"><nav id="menu"><a href="#works" data-t="navWorks">작업물</a><a href="#price" data-t="navPrice">가격</a><a href="#contact" data-t="navContact">문의</a></nav><div class="langs" role="group" aria-label="Language"><button data-lang="ko">한국어</button><button data-lang="en">EN</button><button data-lang="ja">日本語</button><button data-lang="zh">中文</button></div></div></header>
<div class="intro">
<div>
<h1 data-t="hero">자돌이</h1>
<p data-h="intro1"></p>
<p data-t="intro2"></p>
<div class="actions"><a class="btn go" href="https://discord.gg/MBmmrEFRuz" target="_blank" rel="noopener noreferrer" data-t="ask">디스코드로 문의하기</a><a class="btn plain" href="#works" data-t="see">작업물 보기</a></div>
</div>
<figure class="shot"><img id="heroImg" src="img/belmore-1.png" alt=""><figcaption data-t="caption"></figcaption></figure>
</div>
</div>
<main>
<section id="works"><div class="wrap">
<h2 data-t="worksH"></h2>
<p class="lead" data-t="worksLead"></p>
<div id="feature"></div>
<div id="groups"></div>
</div></section>
<section id="price"><div class="wrap">
<h2 data-t="priceH"></h2>
<p class="lead" data-t="priceLead"></p>
<table>
<thead><tr><th data-t="th1"></th><th data-t="th2"></th><th data-t="th3"></th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p class="note" data-t="note"></p>
</div></section>
<section class="contact" id="contact"><div class="wrap">
<h2 data-t="contactH"></h2>
<p data-t="contactP"></p>
<div class="actions"><a class="btn go" href="https://discord.gg/MBmmrEFRuz" target="_blank" rel="noopener noreferrer" data-t="ask"></a><a class="btn plain" id="kmong" href="https://kmong.com/@%EC%9E%90%EB%8F%8C%EC%9D%B4" target="_blank" rel="noopener noreferrer">크몽에서 보기</a></div>
</div></section>
</main>
<footer><div class="wrap">© <span id="year"></span> <span data-t="name"></span></div></footer>
<dialog id="detail" aria-labelledby="dlg-title"><div class="dlg" id="dlg"></div></dialog>
<script src="i18n.js"></script>
<script>
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const order=["mc","bot","web","auto"];
const dlg=document.getElementById("detail"),box=document.getElementById("dlg");
let d;
function pick(){const q=new URLSearchParams(location.search).get("lang");if(T[q])return q;try{const s=localStorage.getItem("lang");if(T[s])return s;}catch(e){}const n=(navigator.language||"").slice(0,2);return T[n]?n:"en";}
function proj(i){const [title,subtitle,status,desc,features,tags]=d.p[i];return {...base[i],title,subtitle,status,desc,features,tags};}
function render(lang){
d=T[lang];
document.documentElement.lang=lang;
document.title=d.title;
document.querySelector('meta[name=description]').content=d.desc;
document.getElementById("menu").setAttribute("aria-label",d.menu);
document.querySelectorAll("[data-t]").forEach(e=>e.textContent=d[e.dataset.t]);
document.querySelectorAll("[data-h]").forEach(e=>e.innerHTML=d[e.dataset.h]);
document.getElementById("heroImg").alt=d.heroAlt;
const km=document.getElementById("kmong");km.hidden=!d.kmong;km.textContent=d.kmong;
document.getElementById("rows").innerHTML=d.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("");
const f=proj(0);
document.getElementById("feature").innerHTML=`<article class="feature"><div><h3>${esc(f.title)}</h3><p class="what">${esc(f.subtitle)}${f.status?", "+esc(f.status):""}</p><ul>${f.features.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><button class="more" data-i="0">${esc(d.more)}</button></div><div class="pics">${f.g.slice(1,3).map(g=>`<img src="${esc(g)}" alt="${esc(f.title+d.shot)}" loading="lazy" data-i="0">`).join("")}</div></article>`;
const groups={};
base.forEach((b,i)=>{if(i)(groups[b.c]=groups[b.c]||[]).push(i);});
document.getElementById("groups").innerHTML=order.filter(g=>groups[g]).map(g=>`<div class="group"><h3>${esc(d.groups[g])}</h3>${groups[g].map(i=>{const p=proj(i);return `<button class="row" data-i="${i}"><img src="${esc(p.t)}" alt="" loading="lazy"><div><strong>${esc(p.title)}</strong><span>${esc(p.subtitle)}</span><small>${esc(p.tags.join(", "))}</small></div></button>`;}).join("")}</div>`).join("");
document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
try{localStorage.setItem("lang",lang);}catch(e){}
}
document.querySelector(".langs").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;render(b.dataset.lang);const u=new URL(location);u.searchParams.set("lang",b.dataset.lang);history.replaceState(null,"",u);});
document.getElementById("works").addEventListener("click",e=>{const t=e.target.closest("[data-i]");if(!t)return;const p=proj(+t.dataset.i);const imgs=p.g||[p.t];box.innerHTML=`<div class="dlg-top"><div><h2 id="dlg-title">${esc(p.title)}</h2>${p.status?`<p class="status">${esc(p.status)}</p>`:""}</div><button class="close" aria-label="${esc(d.close)}">${esc(d.close)}</button></div><p>${esc(p.desc)}</p><ul>${p.features.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="tech">${esc(d.tech+p.tags.join(", "))}</p>${p.l?`<a class="btn go" href="${esc(p.l)}" target="_blank" rel="noopener noreferrer">${esc(d.open)}</a>`:""}${imgs.map(g=>`<img src="${esc(g)}" alt="${esc(p.title+d.shot)}" loading="lazy">`).join("")}`;dlg.showModal();});
box.addEventListener("click",e=>{if(e.target.closest(".close"))dlg.close();});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close();});
document.getElementById("year").textContent=new Date().getFullYear();
render(pick());
</script>
</body>
</html>
